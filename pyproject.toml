[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "geoosint"
version = "0.1.0"
description = "Доказательное географическое расследование через MCP"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28.1,<0.29",
  "geographiclib>=2.1,<3",
  "astral>=3.2,<4",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
  "argon2-cffi>=25.1,<26",
  "shapely>=2.1,<3",
  "pillow>=12,<13",
  "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "pip-audit>=2.9,<3", "psutil>=7.1,<8", "types-shapely>=2.1,<3", "types-defusedxml>=0.7,<1", "pyyaml>=6,<7"]

[project.scripts]
geoosint = "geoosint.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/geoosint/core", "src/geoosint/security"]

[[tool.mypy.overrides]]
module = ["geographiclib.*"]
ignore_missing_imports = true
