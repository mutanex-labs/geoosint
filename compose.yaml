name: geoosint-local
services:
  geoosint:
    build: .
    image: geoosint:local
    # Без OAuth сеть контейнера изолирована. Проверки — через docker compose exec.
    network_mode: none
    environment:
      GEO_MODE: local
      GEO_HOST: 127.0.0.1
      GEO_PORT: 8787
      GEO_DATA_DIR: /data
      GEO_OSM_ENABLED: "false"
    volumes:
      - geoosint-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  geoosint-data:
