# Образец для ручной адаптации существующего HTTPS reverse proxy.
server {
    listen 443 ssl;
    server_name geo.example.org;
    ssl_certificate /OPERATOR_CONFIGURED/fullchain.pem;
    ssl_certificate_key /OPERATOR_CONFIGURED/privkey.pem;
    client_max_body_size 25m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
